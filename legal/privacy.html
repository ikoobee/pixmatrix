  <main class="container">
    <section class="card prose" style="margin-top:24px">
      <h1>隐私政策</h1>
      <p>最后更新：2026-08-28</p>
      <h2>1. 我们不收集你的图片</h2>
      <p>本站全部工具（九宫格切图、图片压缩及后续工具）均在你的浏览器内本地处理。<strong>图片不会上传到我们的任何服务器</strong>，关闭页面后数据即消失。</p>
      <h2>2. 本地存储</h2>
      <p>本站不在你的设备上存储任何数据，所有处理即用即弃。</p>
      <h2>3. 第三方组件与统计</h2>
      <p>点击 ZIP 打包时组件从公共 CDN 加载；统计与广告（若接入）仅收集匿名数据，接入时在此更新说明。</p>
      <h2>4. 联系我们</h2>
      <p>如对本政策有疑问，请联系 <a href="mailto:ikoobee@outlook.com">ikoobee@outlook.com</a>，或在 <a href="https://github.com/ikoobee/pixmatrix" rel="noopener">GitHub 仓库</a>提 issue。</p>

    </section>
